        <p>
            <em>
                <strong>Section 1</strong>
            </em>
            <br/>
            <strong>What do we do with your information?</strong>
        </p>
        <p>When you purchase something from our store, as part of the buying and selling process, we collect the personal information you give us such as your name, address and email address. When you browse our store, we also automatically receive your computer &rsquo;s internet protocol (IP) address in order to provide us with information that helps us learn about your browser and operating system. With your permission, we may send you emails about our store, new products and other updates.</p>
        <p>&nbsp;</p>
        <p>
            <br/>
            <em>
                <strong>Section 2</strong>
            </em>
            <br/>
            <strong>Consent</strong>
        </p>
        <p>
            <strong>How do you get my consent?</strong>
            <br/>When you provide us with personal information to complete a transaction, verify your credit card, place an order, arrange for a delivery or return a purchase, we imply that you consent to our collecting it and using it for that specific reason only.
        </p>
        <p>
            If we ask for your personal information for a secondary reason, like marketing, we will either ask you directly for your expressed consent, or provide you with an opportunity to say no.<br/>
            <br/>
        </p>
        <p>
            <strong>How do I withdraw my consent?</strong>
        </p>
        <p>If after you opt-in, you change your mind, you may withdraw your consent for us to contact you, for the continued collection, use or disclosure of your information, at anytime, by submitting an inquiry via our Contact Page.</p>
        <p>&nbsp;</p>
        <p>
            <em>
                <strong>Section 3</strong>
            </em>
            <br/>
            <strong>Disclosure</strong>
        </p>
        <p>We may disclose your personal information if we are required by law to do so or if you violate our Terms of Service.</p>
        <p>&nbsp;</p>
        <p>
            <em>
                <strong>Section 4</strong>
            </em>
            <br/>
            <strong>Shopify</strong>
        </p>
        <p>Our store is hosted on Shopify Inc. They provide us with the online e-commerce platform that allows us to sell our products and services to you.</p>
        <p>
            Your data is stored through Shopify &rsquo;s data storage, databases and the general Shopify application. They store your data on a secure server behind a firewall.<br/>
            <br/>
        </p>
        <p>
            <strong>Payment</strong>
        </p>
        <p>If you choose a direct payment gateway to complete your purchase, then Shopify stores your credit card data. It is encrypted through the Payment Card Industry Data Security Standard (PCI-DSS). Your purchase transaction data is stored only as long as is necessary to complete your purchase transaction. After that is complete, your purchase transaction information is deleted.</p>
        <p>All direct payment gateways adhere to the standards set by PCI-DSS as managed by the PCI Security Standards Council, which is a joint effort of brands like Visa, MasterCard, American Express and Discover.</p>
        <p>PCI-DSS requirements help ensure the secure handling of credit card information by our store and its service providers.</p>
        <p>For more insight, you may also want to read Shopify &rsquo;s Terms of Service (shopify.com/legal/terms) or Privacy Statement (shopify.com/legal/privacy).</p>
        <p>&nbsp;</p>
        <p>
            <br/>
            <em>
                <strong>Section 5</strong>
            </em>
            <br/>
            <strong>Third-Party Services</strong>
        </p>
        <p>In general, the third-party providers used by us will only collect, use and disclose your information to the extent necessary to allow them to perform the services they provide to us.</p>
        <p>However, certain third-party service providers, such as payment gateways and other payment transaction processors, have their own privacy policies in respect to the information we are required to provide to them for your purchase-related transactions.</p>
        <p>For these providers, we recommend that you read their privacy policies so you can understand the manner in which your personal information will be handled by these providers.</p>
        <p>In particular, remember that certain providers may be located in or have facilities that are located a different jurisdiction than either you or us. So if you elect to proceed with a transaction that involves the services of a third-party service provider, then your information may become subject to the laws of the jurisdiction(s) in which that service provider or its facilities are located.</p>
        <p>As an example, if you are located in Canada and your transaction is processed by a payment gateway located in the United States, then your personal information used in completing that transaction may be subject to disclosure under United States legislation, including the Patriot Act.</p>
        <p>Once you leave our store &rsquo;s website or are redirected to a third-party website or application, you are no longer governed by this Privacy Policy or our website &rsquo;s Terms of Service.</p>
        <p>
            The above excludes text messaging originator opt-in data and consent; this information will not be shared with any third parties.<br/>
            <br/>
        </p>
        <p>
            <strong>Links</strong>
        </p>
        <p>When you click on links on our store, they may direct you away from our site. We are not responsible for the privacy practices of other sites and encourage you to read their privacy statements.</p>
        <p>&nbsp;</p>
        <p>
            <em>
                <strong>Section 6</strong>
            </em>
            <br/>
            <strong>Security</strong>
        </p>
        <p>To protect your personal information, we take reasonable precautions and follow industry best practices to make sure it is not inappropriately lost, misused, accessed, disclosed, altered or destroyed.</p>
        <p>If you provide us with your credit card information, the information is encrypted using secure socket layer technology (SSL) and stored with AES-256 encryption. Although no method of transmission over the Internet or electronic storage is 100% secure, we follow all PCI-DSS requirements and implement additional generally accepted industry standards.</p>
        <p>&nbsp;</p>
        <p>
            <em>
                <strong>Section 7</strong>
            </em>
            <br/>
            <strong>Cookies</strong>
        </p>
        <p>Here is a list of cookies that we use. We &rsquo;ve listed them here so you that you can choose if you want to opt-out of cookies or not.</p>
        <p>
            <em>_session_id</em>
            <br/>unique token, sessional, Allows Shopify to store information about your session (referrer, landing page, etc).
        </p>
        <p>
            <em>_shopify_visit</em>
            <br/>no data held, Persistent for 30 minutes from the last visit, Used by our website provider&rsquo;s internal stats tracker to record the number of visits
        </p>
        <p>
            <em>_shopify_uniq</em>
            <br/>no data held, expires at midnight (relative to the visitor) of the next day, Counts the number of visits to a store by a single customer.
        </p>
        <p>
            <em>cart</em>
            <br/>unique token, persistent for 2 weeks, Stores information about the contents of your cart.
        </p>
        <p>
            <em>_secure_session_id</em>
            <br/>unique token, sessional
        </p>
        <p>
            <em>storefront_digest</em>
            <br/>unique token, indefinite If the shop has a password, this is used to determine if the current visitor has access.
        </p>
        <p>&nbsp;</p>
        <p>
            <em>
                <strong>Section 8</strong>
            </em>
            <br/>
            <strong>Mobile Message Service</strong>
        </p>
        <p>If you have opted in, the SMS Service provides updates, alerts, promotions, special offers, and other marketing offers (e.g., cart reminders) from Juniper via text messages through your wireless provider to the mobile number you provided.</p>
        <p>The website uses cookies to help keep track of items you put into your shopping cart including when you have abandoned your cart and this information is used to determine when to send cart reminder messages via SMS and email. SMS information will not be shared with any third parties.</p>
        <p>&nbsp;</p>
        <p>
            <em>
                <strong>Section 9</strong>
            </em>
            <br/>
            <strong>Age of Consent</strong>
        </p>
        <p>By using this site, you represent that you are at least the age of majority in your state or province of residence, or that you are the age of majority in your state or province of residence and you have given us your consent to allow any of your minor dependents to use this site.</p>
        <p>&nbsp;</p>
        <p>
            <em>
                <strong>Section 10</strong>
            </em>
            <br/>
            <strong>Changes to this Privacy Policy</strong>
        </p>
        <p>We reserve the right to modify this privacy policy at any time, so please review it frequently. Changes and clarifications will take effect immediately upon their posting on the website. If we make material changes to this policy, we will notify you here that it has been updated, so that you are aware of what information we collect, how we use it, and under what circumstances, if any, we use and/or disclose it.</p>
        <p>If our store is acquired or merged with another company, your information may be transferred to the new owners so that we may continue to sell products to you.</p>
        <p>&nbsp;</p>
        <p>
            <strong>Questions and Contact Information</strong>
        </p>
        <p>
            If you would like to: access, correct, amend or delete any personal information we have about you, register a complaint, or simply want more information contact our Privacy Compliance Officer through our <a href=\"/docs/contact\">Contact Page</a>
            .
        </p>
        <p>&nbsp;</p>

        <p style=\"font-size: 20px;\">
            <strong>
                For all questions or inquiries, please reach out to us via our <a style=\"color: var(--color-primary-accent);\" href=\"/docs/contact\">Contact Page</a>
                and we &rsquo;ll get back to you as soon as possible!
            </strong>
        </p>
        <p>&nbsp;</p>
        <p>
            <strong>Shipping Status</strong>
        </p>
        <p>Shipping is currently unavailable or delayed for several countries. Please scroll to the bottom of this page for a full list of affected countries, organized by continent. Thank you for your understanding.</p>
        <p>&nbsp;</p>
        <p>
            <strong>Items Shipped Separately</strong>
        </p>
        <p>
            Many of our products come from different warehouses worldwide! As a result, products in your order may ship separately. Fret not, all of the items in your order will arrive shortly. Please check the tracking numbers for the individual items in your order. If all of your items haven't arrived by the time they were expected to, please contact our customer success team via our <a href=\"/docs/contact\">Contact Page</a>
            and they will make things right. We appreciate your patience in this matter.
        </p>
        <p>&nbsp;</p>
        <p>
            <strong>Package Tracking</strong>
        </p>
        <p>All orders come with tracking information. However, if certain products ship from another warehouse, you will receive a separate tracking link for those items. To track those products, please visit the \"Order Confirmed\" email you received after you placed the order. Within that email, you will be able to click the tracking links for those products to determine their shipping status. You will also receive shipping status emails for products not found in the initial tracking email after they ship.</p>
        <p>&nbsp;</p>
        <p>
            <strong>Store Currency</strong>
        </p>
        <p>All prices on this site are given in USD, unless otherwise specified. If you are paying by credit card in a currency other than USD, you will be charged in your own currency at the exchange rate determined by your credit card provider.</p>
        <p>&nbsp;</p>
        <p>
            <strong>Refund and Return Policy</strong>
        </p>
        <p>
            All product sales are final upon shipment. Once an order has been shipped, we are unable to cancel or make any changes to your order. If your order has not yet been fulfilled, please contact us via our <a href=\"/docs/contact\">Contact Page</a>
            and our team will be in touch.
        </p>
        <p>&nbsp;</p>
        <p>
            <strong>Damaged Product or Wrong Order</strong>
        </p>
        <p>If your order is damaged or you received a faulty product, you are eligible for either a refund or re-shipment of your product. All requests must be made within 30 days of delivery.</p>
        <p>&nbsp;</p>
        <p>
            <strong>Product Not Received In Time</strong>
        </p>
        <p>If your order does not arrive within 10 business days of the estimated delivery date, we will consider the order lost-in-transit. We then will offer a full refund or a re-shipment of the lost-in-transit order.</p>
        <p>&nbsp;</p>
        <p>
            <strong>Incorrect Shipping Address</strong>
        </p>
        <p>If you entered an incorrect shipping address, please notify us of the requested change immediately. We are only able to make changes to your shipping address prior to shipping your order. We cannot offer a refund if you notify us after the order has been shipped to the original address.</p>
        <p>&nbsp;</p>
        <p>
            <strong>Incorrect Order</strong>
        </p>
        <p>If you made a mistake in your order, please notify us of the requested change immediately as the production of your order often will begin on the same day you placed the order. We are only able to make changes to your order prior to production.</p>
        <p>&nbsp;</p>
        <p>
            <strong>Product Delivery Times</strong>
        </p>
        <p>Delivery times vary by product as a result of individual production and shipping times. Times will be calculated at checkout.</p>
        <p>&nbsp;</p>
        <p>
            <strong>Shipping Prices</strong>
        </p>
        <p>Shipping prices are all given at cost and calculated based on order destination, contents, weight and size. Expedited shipping options may or may not be offered based on the product and destination. All available options will be present at checkout.</p>
        <p>Additional customs charges may apply depending on your local government (outside of the US). These charges are paid for upon delivery, or at a held checkpoint. Please contact your local mailing service provider for specific details.</p>
        <p>&nbsp;</p>
        <p>
            <strong>Company Headquarters</strong>
        </p>
        <p>The company office is located at the following address. Please note that we do not accept returns here, so do not send any packages to this address.</p>
        <p>
            Juniper Creates<br/>
            123 Edward St, Unit 205<br/>
            Toronto, ON M5G 1E2<br/>Canada
        </p>
        <p>&nbsp;</p>
        <p>
            <strong>Contact</strong>
        </p>
        <p>
            Your satisfaction is our number one priority. For all inquiries or questions, please reach out to us via our <a href=\"/docs/contact\">Contact Page</a>
            and our Customer Success Team will happily help you out. For any questions related to orders, please ensure you include all relevant information so that our team can quickly help. Otherwise, contact us at shop@hellojuniper.com and we &rsquo;ll get back to you as soon as possible.
        </p>

        <div class=\"faq-container\">
            <details>
                <summary>How do I get an in-game reward?</summary>
                <div class=\"faq-content\">
                    <p>Select products include an in-game reward for a limited time. Eligibility is clearly noted on the product page.</p>
                </div>
            </details>
            <details>
                <summary>When will I be sent my in-game reward?</summary>
                <div class=\"faq-content\">
                    <p>If your purchase includes an in-game reward, you'll receive a separate email with your unique in-game code approximately 24 hours after purchase.</p>
                </div>
            </details>
            <details>
                <summary>It's been 24 hours and I haven't received my in-game reward. What should I do?</summary>
                <div class=\"faq-content\">
                    <p>First, check your spam or promotions folder, as the email may have been filtered.</p>
                    <p>If you still don't see it, reach out to our customer support team and we'll be happy to help.</p>
                </div>
            </details>
            <details>
                <summary>How can I redeem the in-game code?</summary>
                <div class=\"faq-content\">
                    <ol>
                        <li>Launch Gorilla Tag</li>
                        <li>Access the computer in Stump</li>
                        <li>Navigate to the Redeem tab</li>
                        <li>Enter your code</li>
                        <li>Press ENTER</li>
                    </ol>
                    <p>
                        <strong>Compatibility</strong>
                    </p>
                    <p>In-Game Rewards are not available on Quest 1 or PSVR2 and can only be redeemed on supported Gorilla Tag platforms.</p>
                    <p>
                        <strong>Validation</strong>
                    </p>
                    <p>After submitting your code, you'll receive one of the following responses:</p>
                    <ul>
                        <li>
                            <strong>INVALID CODE</strong>
                            – The code does not match one in our database
                        </li>
                        <li>
                            <strong>SUCCESSFULLY CLAIMED!</strong>
                            – The code was valid and redeemed successfully
                        </li>
                        <li>
                            <strong>CODE ALREADY CLAIMED</strong>
                            – The code has already been redeemed
                        </li>
                        <li>
                            <strong>CODE IS NOT REDEEMABLE UNTIL &lt;Date and Time &gt;</strong>
                            – The code is valid but time-locked. The date and time shown reflect your headset's current time zone.
                        </li>
                    </ul>
                </div>
            </details>
            <details>
                <summary>What is the return policy on orders with an in-game code?</summary>
                <div class=\"faq-content\">
                    <p>Once an in-game code has been delivered (approximately 24 hours after purchase), the item becomes final sale and is no longer eligible for returns or refunds.</p>
                </div>
            </details>
        </div>
